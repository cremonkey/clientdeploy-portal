<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ClientDeploy Showreel</title>
<style>
  @font-face { font-family: 'Inter'; src: url(fonts/Inter.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'JB'; src: url(fonts/JetBrainsMono.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =========================================================================
   ClientDeploy Portal — 30s motion showreel
   Everything is a pure function of time t (seconds), so any frame can be
   rendered independently (parallel render workers + motion-blur subframes).
   Timeline cues here are mirrored in audio.py — keep them in sync.
   ========================================================================= */
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, DUR = 30;
const cv = document.getElementById('c');
const out = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
const tctx = tmp.getContext('2d');

const C = {
  bg: '#020617', navy: '#0c386f', deep: '#07122b', brand: '#0e81eb', brand4: '#38a1f8',
  cyan: '#00d2ff', elec: '#3b82f6', green: '#10b981', green2: '#34d399', red: '#ef4444',
  amber: '#f59e0b', white: '#f8fafc', muted: '#94a3b8', dim: '#475569', line: 'rgba(255,255,255,0.08)',
};
const SANS = 'Inter', MONO = 'JB';

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  inBack: (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x,
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
const ez = (t, a, b, f = E.outExpo) => f(P(t, a, b));
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; }
const TAU = Math.PI * 2;

/* ---------- drawing helpers ---------- */
function font(size, weight = 800, fam = SANS) { ctx.font = `${weight} ${size}px ${fam}`; }
function text(s, x, y, o = {}) {
  const { size = 64, weight = 800, fam = SANS, color = C.white, align = 'center', base = 'middle', alpha = 1, ls = 0, glow = 0, glowColor } = o;
  if (alpha <= 0) return;
  ctx.save();
  font(size, weight, fam);
  ctx.letterSpacing = ls + 'px';
  ctx.textAlign = align; ctx.textBaseline = base;
  ctx.globalAlpha *= alpha;
  ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = glowColor || color; ctx.shadowBlur = glow; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, weight = 800, fam = SANS, ls = 0) {
  ctx.save(); font(size, weight, fam); ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glass(x, y, w, h, r, a = 1) {
  ctx.save(); ctx.globalAlpha *= a;
  rrect(x, y, w, h, r);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, 'rgba(30,41,59,0.78)'); g.addColorStop(1, 'rgba(15,23,42,0.86)');
  ctx.fillStyle = g; ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.09)'; ctx.lineWidth = 1.5; ctx.stroke();
  // top highlight
  ctx.beginPath(); ctx.moveTo(x + r, y + 1); ctx.lineTo(x + w - r, y + 1);
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.stroke();
  ctx.restore();
}
function check(x, y, s, prog, color = C.white, lw = 6) {
  if (prog <= 0) return;
  const pts = [[-0.5, 0.02], [-0.14, 0.36], [0.52, -0.34]];
  const l1 = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]), l2 = Math.hypot(pts[2][0] - pts[1][0], pts[2][1] - pts[1][1]);
  const d = prog * (l1 + l2);
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s);
  if (d <= l1) { const k = d / l1; ctx.lineTo(x + lerp(pts[0][0], pts[1][0], k) * s, y + lerp(pts[0][1], pts[1][1], k) * s); }
  else { ctx.lineTo(x + pts[1][0] * s, y + pts[1][1] * s); const k = (d - l1) / l2; ctx.lineTo(x + lerp(pts[1][0], pts[2][0], k) * s, y + lerp(pts[1][1], pts[2][1], k) * s); }
  ctx.stroke(); ctx.restore();
}
function cross(x, y, s, color, lw = 6, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke(); ctx.restore();
}
function upArrow(x, y, s, color, lw) { // deploy glyph: arrow rising out of a tray
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.42); ctx.lineTo(x, y - s * 0.5);
  ctx.moveTo(x - s * 0.36, y - s * 0.16); ctx.lineTo(x, y - s * 0.52); ctx.lineTo(x + s * 0.36, y - s * 0.16); ctx.stroke(); ctx.restore();
}
function lockIcon(x, y, s, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = s * 0.12;
  ctx.beginPath(); ctx.arc(x, y - s * 0.12, s * 0.26, Math.PI, 0); ctx.stroke();
  rrect(x - s * 0.4, y - s * 0.12, s * 0.8, s * 0.6, s * 0.1); ctx.fill();
  ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(x, y + s * 0.14, s * 0.08, 0, TAU); ctx.fill(); ctx.restore();
}
function cursor(x, y, sc = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 44); ctx.lineTo(11, 33); ctx.lineTo(19, 51); ctx.lineTo(26, 48); ctx.lineTo(18, 30); ctx.lineTo(33, 30); ctx.closePath();
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
}
function gradText(s, x, y, size, weight, c1, c2, o = {}) {
  const w = measure(s, size, weight, SANS, o.ls || 0);
  const x0 = o.align === 'left' ? x : x - w / 2;
  const g = ctx.createLinearGradient(x0, y - size / 2, x0 + w, y + size / 2);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  text(s, x, y, { size, weight, color: g, ...o });
}
function wrapText(s, x, y, maxW, lh, o) {
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (measure(test, o.size, o.weight || 400) > maxW && line) { text(line, x, yy, o); line = w; yy += lh; } else line = test;
  }
  text(line, x, yy, o);
}
/* staggered per-letter rise with mask */
function riseText(s, x, y, t0, t, o = {}) {
  const { size = 120, weight = 900, stagger = 0.028, dur = 0.5, colorFn, align = 'center', ls = 0 } = o;
  const total = measure(s, size, weight, SANS, ls);
  let cx = align === 'center' ? x - total / 2 : x;
  ctx.save();
  ctx.beginPath(); ctx.rect(cx - 40, y - size * 0.75, total + 80, size * 1.35); ctx.clip();
  for (let i = 0; i < s.length; i++) {
    const ch = s[i]; const w = measure(ch, size, weight, SANS, ls);
    const k = ez(t, t0 + i * stagger, t0 + i * stagger + dur, E.outQuint);
    if (k > 0) text(ch, cx, y + (1 - k) * size * 1.1, { size, weight, align: 'left', color: colorFn ? colorFn(i) : C.white, alpha: 1, ls });
    cx += w;
  }
  ctx.restore();
}

/* ---------- camera shake from impacts (mirrored in audio.py) ---------- */
const IMPACTS = [
  [2.95, 10], [3.625, 16], [4.25, 16], [4.875, 18], [6.0, 42], [9.55, 8], [12.0, 20], [17.5, 22],
  [18.2, 10], [18.7, 12], [19.2, 14], [20.25, 16], [21.5, 14], [22.25, 10], [23.0, 10], [23.75, 10],
  [24.5, 12], [28.0, 36],
];
function shake(t) {
  let x = 0, y = 0, r = 0;
  for (const [ti, a] of IMPACTS) {
    const d = t - ti; if (d < 0 || d > 0.6) continue;
    const k = a * Math.exp(-d * 9);
    x += noise1(t * 60 + ti * 13) * k; y += noise1(t * 60 + ti * 29 + 5) * k; r += noise1(t * 40 + ti) * k * 0.0009;
  }
  return { x, y, r };
}

/* ---------- persistent background ---------- */
function background(t, o = {}) {
  const { tint = C.bg, gridA = 1, glowA = 1 } = o;
  ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H);
  // drifting aurora glows
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = glowA;
  const blobs = [[0.2, 0.25, C.brand, 700, 0.35], [0.82, 0.7, C.cyan, 620, 0.22], [0.6, 0.15, C.elec, 520, 0.2]];
  blobs.forEach(([bx, by, col, r, a], i) => {
    const x = W * bx + Math.sin(t * 0.35 + i * 2) * 140, y = H * by + Math.cos(t * 0.3 + i) * 90;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = a * glowA; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  ctx.restore();
  // perspective floor grid, scrolling toward camera
  if (gridA > 0) {
    ctx.save(); ctx.globalAlpha = 0.22 * gridA; ctx.strokeStyle = C.brand4; ctx.lineWidth = 1.2;
    const hy = H * 0.56, fl = 380;
    for (let i = -18; i <= 18; i++) { ctx.beginPath(); ctx.moveTo(CX + i * 18, hy); ctx.lineTo(CX + i * 260, H + 40); ctx.stroke(); }
    const off = (t * 0.9) % 1;
    for (let j = 0; j < 14; j++) {
      const z = (j + 1 - off); const y = hy + fl / z * 0.9; if (y > H + 10 || y < hy) continue;
      ctx.globalAlpha = 0.22 * gridA * clamp((y - hy) / 200);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    const fade = ctx.createLinearGradient(0, hy - 20, 0, hy + 260);
    fade.addColorStop(0, tint); fade.addColorStop(1, 'rgba(2,6,23,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = fade; ctx.fillRect(0, hy - 20, W, 280);
    ctx.restore();
  }
  // dust particles
  ctx.save();
  for (let i = 0; i < 70; i++) {
    const sp = 12 + hash(i * 3.1) * 40;
    const x = (hash(i) * W + t * sp * (hash(i * 7) > .5 ? 1 : -0.6)) % W;
    const y = (hash(i * 1.7) * H - t * sp * 0.5 + H * 10) % H;
    const a = 0.15 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2 + i));
    ctx.globalAlpha = a * 0.6; ctx.fillStyle = hash(i * 9) > .7 ? C.cyan : '#cbd5e1';
    ctx.beginPath(); ctx.arc((x + W) % W, y, 0.8 + hash(i * 5) * 1.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ---------- radial particle burst (analytic) ---------- */
function burst(t, t0, x, y, o = {}) {
  const { n = 60, speed = 900, life = 1.2, colors = [C.cyan, C.brand, C.white], seed = 1, size = 4, gravity = 0, streak = 0.035, drag = 3.2 } = o;
  const d = t - t0; if (d < 0 || d > life) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = hash(i * 12.9 + seed) * TAU, v = speed * (0.35 + 0.65 * hash(i * 4.3 + seed));
    const dist = v * (1 - Math.exp(-drag * d)) / drag;
    const px = x + Math.cos(a) * dist, py = y + Math.sin(a) * dist + gravity * d * d;
    const vv = v * Math.exp(-drag * d);
    const tx = px - Math.cos(a) * vv * streak, ty = py - Math.sin(a) * vv * streak - gravity * d * streak * 2;
    const k = 1 - d / life;
    ctx.globalAlpha = k; ctx.strokeStyle = colors[i % colors.length]; ctx.lineWidth = size * (0.5 + hash(i + seed * 3));
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(px, py); ctx.stroke();
  }
  ctx.restore();
}
function confetti(t, t0, x, y, seed = 7) {
  const d = t - t0; if (d < 0 || d > 2.2) return;
  const cols = [C.cyan, C.green2, C.brand4, C.white, C.amber];
  ctx.save();
  for (let i = 0; i < 70; i++) {
    const a = -Math.PI / 2 + (hash(i * 3.3 + seed) - 0.5) * 2.4, v = 500 + 900 * hash(i * 1.9 + seed);
    const drag = 1.8;
    const dist = v * (1 - Math.exp(-drag * d)) / drag;
    const px = x + Math.cos(a) * dist + Math.sin(d * 6 + i) * 18, py = y + Math.sin(a) * dist + 520 * d * d;
    ctx.save(); ctx.translate(px, py); ctx.rotate(d * (4 + hash(i) * 8) + i);
    ctx.scale(1, Math.cos(d * 9 + i));
    ctx.globalAlpha = clamp(2.2 - d); ctx.fillStyle = cols[i % cols.length];
    ctx.fillRect(-7, -4, 14, 8); ctx.restore();
  }
  ctx.restore();
}
function ring(t, t0, x, y, o = {}) {
  const { r0 = 20, r1 = 420, dur = 0.7, color = C.cyan, lw = 10 } = o;
  const k = P(t, t0, t0 + dur); if (k <= 0 || k >= 1) return;
  const e = E.outExpo(k);
  ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = color; ctx.lineWidth = lw * (1 - k) + 1;
  ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(x, y, lerp(r0, r1, e), 0, TAU); ctx.stroke(); ctx.restore();
}

/* ---------- glitch post (slice displacement + RGB split) ---------- */
function glitch(amount, seed) {
  if (amount <= 0.01) return;
  tctx.clearRect(0, 0, W, H); tctx.drawImage(buf, 0, 0);
  const slices = 14;
  for (let i = 0; i < slices; i++) {
    if (hash(i * 7 + seed) > amount * 1.2) continue;
    const y = Math.floor(hash(i * 3 + seed * 1.3) * H), h = 6 + hash(i + seed) * 70;
    const dx = (hash(i * 11 + seed) - 0.5) * 220 * amount;
    ctx.drawImage(tmp, 0, y, W, h, dx, y, W, h);
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35 * amount;
  ctx.filter = 'hue-rotate(160deg)'; ctx.drawImage(tmp, 10 * amount, 0);
  ctx.filter = 'none'; ctx.restore();
}

/* =========================================================================
   SCENES
   ========================================================================= */

/* S1 — cold open: dot → line → typed command (0 – 3.0) */
const CMD = '$ clientdeploy ship acme-store';
const TYPE0 = 1.05, TYPE_DT = 0.035;
function S1(t) {
  background(t, { gridA: ez(t, 0.9, 2.2, E.outCubic) * 0.6, glowA: ez(t, 0.4, 2, E.outCubic) * 0.7 });
  const x0 = CX - 520, lineY = CY + 52;
  const stretch = ez(t, 0.45, 1.0, E.outExpo);
  // heartbeat dot
  if (t < 1.0) {
    const beat = Math.exp(-((t - 0.1) % 0.5) * 9) * (t > 0.1 ? 1 : 0);
    const r = 7 + beat * 10;
    ctx.save(); ctx.globalAlpha = ez(t, 0, 0.15); ctx.fillStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 40 + beat * 60;
    const w = lerp(r * 2, 1040, stretch);
    rrect(CX - w / 2, lineY - r * (1 - stretch * 0.7), w, r * 2 * (1 - stretch * 0.7), r); ctx.fill(); ctx.restore();
  }
  if (t >= 1.0) {
    const col = ez(t, 2.45, 2.95, E.inExpo);
    const w = 1040 * (1 - col);
    ctx.save(); ctx.fillStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 40;
    ctx.fillRect(CX - w / 2, lineY - 2, w, 4); ctx.restore();
    // typed command
    const n = clamp(Math.floor((t - TYPE0) / TYPE_DT) + 1, 0, CMD.length);
    const s = CMD.slice(0, n);
    ctx.save(); ctx.globalAlpha = 1 - col;
    text('$', x0, CY - 12, { size: 58, weight: 700, fam: MONO, color: C.cyan, align: 'left' });
    text(s.slice(1), x0 + measure('$', 58, 700, MONO), CY - 12, { size: 58, weight: 700, fam: MONO, color: C.white, align: 'left' });
    const cw = measure(s, 58, 700, MONO);
    if (Math.floor(t * 3.2) % 2 === 0 || (t > TYPE0 && t < TYPE0 + CMD.length * TYPE_DT)) { ctx.fillStyle = C.cyan; ctx.fillRect(x0 + cw + 6, CY - 42, 26, 58); }
    // response
    const r = ez(t, 2.35, 2.55);
    text('▸ packaging  ·  zero servers touched', x0, CY + 110, { size: 28, weight: 400, fam: MONO, color: C.muted, align: 'left', alpha: r });
    ctx.restore();
  }
  // label top-left
  text('CLIENTDEPLOY / SHOWREEL 2026', 80, 70, { size: 18, weight: 700, color: C.dim, align: 'left', ls: 6, alpha: ez(t, 0.3, 1) });
}

/* S2 — kinetic problem statement (3.0 – 6.0) */
const WORDS = [['SSH KEYS', 3.25], ['SERVER ACCESS', 3.875], ['A DEVOPS TEAM', 4.5]];
function S2(t) {
  const lt = t - 3.0;
  // bg: deep navy with sliding diagonal stripes
  ctx.fillStyle = '#040b1f'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.07; ctx.fillStyle = C.brand4; ctx.translate(CX, CY); ctx.rotate(-0.35);
  for (let i = -30; i < 30; i++) ctx.fillRect(i * 110 + (t * 260) % 110, -1400, 34, 2800);
  ctx.restore();
  // top line
  const topA = t < 5.125 ? 1 : 0;
  riseText("YOUR CLIENTS DON'T NEED", CX, 300, 3.0, t < 5.1 ? t : 3.0 - 1, { size: 44, weight: 800, stagger: 0.012, dur: 0.35, colorFn: () => C.muted, ls: 10 });
  if (t >= 5.125) riseText('THEY NEED', CX, 300, 5.125, t, { size: 44, weight: 800, stagger: 0.02, dur: 0.3, colorFn: () => C.cyan, ls: 10 });
  // words
  WORDS.forEach(([w, tin], i) => {
    const tout = i < 2 ? WORDS[i + 1][1] : 5.125;
    if (t < tin || t > tout + 0.12) return;
    const kin = ez(t, tin, tin + 0.28, E.outExpo);
    const kout = ez(t, tout - 0.02, tout + 0.12, E.inCubic);
    const strike = tin + 0.375;
    const ks = ez(t, strike, strike + 0.1, E.outCubic);
    ctx.save(); ctx.translate(CX, CY + 40 - kout * 160);
    const sc = lerp(1.9, 1, kin) * (1 - kout * 0.3);
    ctx.scale(sc, sc * (1 + kout * 0.4));
    const struck = t >= strike;
    text(w, 0, 0, { size: 170, weight: 900, color: struck ? '#64748b' : C.white, alpha: kin * (1 - kout), ls: -4 });
    if (ks > 0) {
      const ww = measure(w, 170, 900, SANS, -4) + 60;
      ctx.rotate(-0.06);
      ctx.fillStyle = C.red; ctx.shadowColor = C.red; ctx.shadowBlur = 30; ctx.globalAlpha = 1 - kout;
      ctx.fillRect(-ww / 2, -12, ww * ks, 24);
    }
    ctx.restore();
  });
  // payoff
  if (t >= 5.375) {
    const k = ez(t, 5.375, 5.6, E.outBack);
    ctx.save(); ctx.translate(CX, CY + 40); ctx.scale(k, k);
    gradText('ONE BUTTON.', 0, 0, 200, 900, C.cyan, C.brand4, { ls: -6, glow: 50, glowColor: 'rgba(0,210,255,0.6)' });
    ctx.restore();
  }
  // iris to cyan
  const ir = ez(t, 5.72, 6.0, E.inExpo);
  if (ir > 0) { ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.arc(CX, CY + 40, ir * 1250, 0, TAU); ctx.fill(); }
}

/* Logo mark + wordmark, reused by S3 and S9 */
function logoMark(x, y, s, t, t0) {
  const draw = ez(t, t0 + 0.05, t0 + 0.6, E.outCubic);
  const arrow = ez(t, t0 + 0.15, t0 + 0.75, E.outBack);
  ctx.save(); ctx.translate(x, y);
  // glass fill
  ctx.globalAlpha = draw; rrect(-s / 2, -s / 2, s, s, s * 0.26);

/* =========================================================================

function drawScene(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';

  else if (t < 17.45) { if (t < 13.4) S4(t); S5(t); }
  else if (t < 21.5) S6(t);
  else if (t < 24.5) S7(t);
  else if (t < 28.0) S8(t);
  else S9(t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // glitch moments
  const gl = [[2.62, 0.35], [3.625, 0.12], [4.25, 0.12], [4.875, 0.14], [17.35, 0.15], [21.45, 0.1], [27.9, 0.12]];
  for (const [gt, gd] of gl) { const k = P(t, gt, gt + gd); if (k > 0 && k < 1) glitch(Math.sin(k * Math.PI), Math.floor(t * 30)); }
  for (let i = 0; i < LOGS.length; i++) if (LOGS[i][1]) { const rt = SCAN0 + i * SCAN_DT + 0.05; const k = P(t, rt, rt + 0.08); if (k > 0 && k < 1) glitch(0.25 * Math.sin(k * Math.PI), Math.floor(t * 60) + i); }
  // final fade
  const fo = ez(t, 29.55, 30.0, E.inCubic);
  if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}

/* grain + vignette, applied once per output frame */
const grains = [];
for (let g = 0; g < 6; g++) {
  const c = document.createElement('canvas'); c.width = 480; c.height = 270; const x = c.getContext('2d');
  const id = x.createImageData(480, 270);
  for (let i = 0; i < id.data.length; i += 4) { const v = hash(i * 0.37 + g * 999.1) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); grains.push(c);
}
function finish(frame) {
  out.save(); out.globalCompositeOperation = 'overlay'; out.globalAlpha = 0.07; out.imageSmoothingEnabled = false;
  out.drawImage(grains[frame % grains.length], 0, 0, W, H); out.restore();
  const v = out.createRadialGradient(CX, CY, H * 0.35, CX, CY, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  out.fillStyle = v; out.fillRect(0, 0, W, H);
}

/* motion blur: average N sub-frames across a 180° shutter */
window.FPS = 60;
window.renderFrame = function (frame, sub = 4) {
  const t0 = frame / window.FPS, shutter = 0.5 / window.FPS;
  out.globalCompositeOperation = 'source-over';
  for (let i = 0; i < sub; i++) {
    const t = Math.min(DUR - 1e-4, t0 + (sub > 1 ? (i / (sub - 1) - 0.5) * shutter : 0));
    drawScene(Math.max(0, t));
    out.globalAlpha = 1 / (i + 1); out.drawImage(buf, 0, 0);
  }
  out.globalAlpha = 1;
  finish(frame);
};
window.ready = document.fonts.load('900 40px Inter').then(() => document.fonts.load('400 20px JB')).then(() => document.fonts.ready).then(() => true);
</script>
